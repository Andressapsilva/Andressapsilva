<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="bg" cx="75%" cy="50%" r="70%"><stop offset="0" stop-color="#1e1146"/><stop offset="1" stop-color="#0b0816"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".4"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="190" fill="url(#glow)"/>
  <g transform="translate(960 150)" fill="none" stroke="url(#t)" stroke-width="2" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" opacity=".7"/>
      <path d="M0,-105 0,-60 M91,-52 52,-30 M91,52 52,30 M0,105 0,60 M-91,52 -52,30 M-91,-52 -52,-30" opacity=".6"/>
    </g>
    <g opacity=".5"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <rect x="-70" y="-70" width="140" height="140" transform="rotate(45)"/>
    </g>
  </g>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="90" y="98" fill="#60a5fa" font-size="16" opacity=".85">&gt; hello, world_</text>
    <text x="88" y="178" fill="url(#t)" font-size="92" font-weight="700" letter-spacing="8">ANDRESSA</text>
    <text x="92" y="222" fill="#c4b5fd" font-size="24" letter-spacing="6">Software Engineering</text>
